<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/logo192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b2a6f" />
    <meta
      name="description"
      content="Glow Petroleum Safety, Health and Environment portal"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Glow SHE</title>
    <style>
      /* Shown instantly while the app's code downloads; React replaces it when it starts */
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; background: linear-gradient(160deg, #0b2a6f 0%, #001a4d 100%); color: rgba(255,255,255,0.75);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; }
      .boot-mark { position: relative; width: 84px; height: 84px; border-radius: 50%; background: #fff;
        display: flex; align-items: center; justify-content: center; }
      .boot-mark img { width: 56px; height: 56px; border-radius: 12px; }
      .boot-ring { position: absolute; inset: -6px; border-radius: 50%; border: 3px solid rgba(204,0,0,0.15);
        border-top-color: #CC0000; border-right-color: #0072BC; animation: boot-spin 0.9s linear infinite; }
      .boot-title { font-size: 1.4rem; font-weight: 800; color: #fff; }
      .boot-msg { font-size: 0.9rem; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to use Glow SHE.</noscript>
    <div id="root">
      <div class="boot" role="status">
        <div class="boot-mark"><span class="boot-ring"></span><img src="%PUBLIC_URL%/logo192.png" alt="" /></div>
        <div class="boot-title">Glow SHE</div>
        <div class="boot-msg">Loading Glow SHE...</div>
      </div>
    </div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
